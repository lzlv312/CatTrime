# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 2GB (reduced to avoid OOM)
org.gradle.jvmargs=-Xmx2048M -XX:+HeapDumpOnOutOfMemoryError -Dhttps.protocols=TLSv1.2,TLSv1.3

# Limit parallel compilation to avoid out of memory
android.native.buildOutput=verbose

# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true

# Set Kotlin JVM target to 17
kotlin.jvm.target.validation.mode=warning
